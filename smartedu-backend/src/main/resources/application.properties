# Server Port
# Locally it will use 9999.
# On Render it will automatically use the PORT provided by Render.
server.port=${PORT:9999}

# Database Configuration
# Local fallback = your MySQL database
# Render = environment variables supplied by Render PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/smartedu?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root123}

# Driver Class
# Spring Boot usually detects this automatically.
# Uncomment the PostgreSQL line only if needed.
# spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate Dialect
# Hibernate can auto-detect the correct dialect.
# No need to hardcode MySQL8Dialect.

# JWT Configuration
jwt.secret=${JWT_SECRET:c21hcnRlZHUtc3VwZXItc2VjcmV0LWtleS1mb3Itand0LWF1dGhlbnRpY2F0aW9uLW1pbi0yNTYtYml0cw==}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}


