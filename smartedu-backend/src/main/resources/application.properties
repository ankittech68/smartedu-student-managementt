# Server Port
# Locally it will use 9999.
# On Render it will automatically use the PORT provided by Render.
server.port=${PORT:9999}

# Database Configuration
# Local fallback = your MySQL database on port 3307
# Render = environment variables supplied by Render PostgreSQL
# The env vars on Render will override these defaults
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/smartedu?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root123}

# Driver Class
# Spring Boot auto-detects the driver from the URL
# On Render, the SPRING_DATASOURCE_URL starts with jdbc:postgresql:// so it auto-selects PostgreSQL driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate Dialect
# Hibernate auto-detects dialect from the datasource URL

# JWT Configuration
jwt.secret=${JWT_SECRET:c21hcnRlZHUtc3VwZXItc2VjcmV0LWtleS1mb3Itand0LWF1dGhlbnRpY2F0aW9uLW1pbi0yNTYtYml0cw==}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}
